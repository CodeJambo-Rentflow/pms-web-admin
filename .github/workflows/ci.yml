name: CI

on:
  push:
    branches: [main, 'feature/**', 'bugfix/**', 'hotfix/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect project type
        id: detect
        run: |
          if [ -f pom.xml ]; then echo "type=maven" >> $GITHUB_OUTPUT;
          elif [ -f package.json ]; then echo "type=node" >> $GITHUB_OUTPUT;
          else echo "type=unknown" >> $GITHUB_OUTPUT; fi
      - name: Set up JDK
        if: steps.detect.outputs.type == 'maven'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Maven lint
        if: steps.detect.outputs.type == 'maven'
        run: mvn -B checkstyle:check || true
      - name: Set up Node
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm install + lint
        if: steps.detect.outputs.type == 'node'
        run: |
          npm ci
          npm run lint --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Detect project type
        id: detect
        run: |
          if [ -f pom.xml ]; then echo "type=maven" >> $GITHUB_OUTPUT;
          elif [ -f package.json ]; then echo "type=node" >> $GITHUB_OUTPUT;
          else echo "type=unknown" >> $GITHUB_OUTPUT; fi
      - name: Set up JDK
        if: steps.detect.outputs.type == 'maven'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven test
        with:
          node-version: '20'
          cache: npm
        if: steps.detect.outputs.type == 'node'
        run: |
          npm test --if-present
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
      - uses: actions/checkout@v4
        id: detect
        run: |
          if [ -f pom.xml ]; then echo "type=maven" >> $GITHUB_OUTPUT;
          else echo "type=unknown" >> $GITHUB_OUTPUT; fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package
        if: steps.detect.outputs.type == 'maven'
        run: mvn -B package -DskipTests
      - name: Set up Node
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm build
        if: steps.detect.outputs.type == 'node'
        run: |
          npm ci
          npm run build --if-present          cache: npm
        if: steps.detect.outputs.type == 'maven'
          elif [ -f package.json ]; then echo "type=node" >> $GITHUB_OUTPUT;
